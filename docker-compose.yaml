version: '3.8'

services:
  threat_db:
    image: postgres:17
    environment:
      POSTGRES_DB: threat
      POSTGRES_USER: cat_user
      POSTGRES_PASSWORD: catgoescatsitscatstays
    volumes:
      - postgres_threat_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  threat_backend:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 backend.wsgi:application"
    ports:
      - "8000:8000"
    depends_on:
      - threat_db

volumes:
  postgres_threat_data:
